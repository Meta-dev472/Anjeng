# Konfigurasi deploy Netlify
# Tiap route punya file HTML nyata (dist/proker/index.html, dst.), sehingga
# TIDAK dibutuhkan rewrite apa pun. Netlify otomatis:
#   - menyajikan dist/404.html untuk URL yang tidak ditemukan
#   - mengarahkan /proker → /proker/ (pretty URLs)

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
