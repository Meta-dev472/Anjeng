<script>
    (function () {
      var root = document.documentElement;

      /* Tema awal diterapkan sebelum CSS menggambar → tidak ada kedipan.
         Default situs adalah TERANG; mode gelap hanya aktif bila pengunjung
         sendiri memilihnya lewat tombol tema (pilihan itu tersimpan). */
      var theme = 'light';
      try {
        var stored = localStorage.getItem('osis-theme');
        if (stored === 'dark' || stored === 'light') theme = stored;
      } catch (e) { /* localStorage bisa diblokir — abaikan */ }
      root.setAttribute('data-theme', theme);

      /* Warna antarmuka browser (address bar) mengikuti tema aktif */
      try {
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#ffffff');
      } catch (e) { /* abaikan */ }

      /* Penanda JS aktif; dipakai CSS untuk menyembunyikan elemen animasi
         lebih awal (anti-kedip) */
      root.classList.add('js');

      /* Pengguna yang memilih "kurangi gerakan": konten langsung terlihat */
      try {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          root.classList.add('reduce-motion');
        }
      } catch (e) { /* abaikan */ }

      /* Pengaman anti-kedip: kalau aplikasi gagal boot dalam 2,5 detik,
         penanda .js dilepas agar konten tidak tertinggal tersembunyi. */
      window.__osisBooted = false;
      setTimeout(function () {
        if (!window.__osisBooted) root.classList.remove('js');
      }, 2500);

      /* Tautan lama berbasis anchor (#profil, #proker, dst.) dialihkan ke
         route barunya. Dijalankan sebelum render supaya tidak ada kedipan. */
      var LEGACY = {
        '#beranda': '/',
        '#profil': '/profil/',
        '#visi-misi': '/visi-misi/',
        '#proker': '/proker/',
        '#kontak': '/kontak/'
      };
      var target = LEGACY[location.hash];
      if (target && (location.pathname === '/' || location.pathname === '/index.html')) {
        if (target === '/') history.replaceState(null, '', '/'); // cukup buang hash
        else location.replace(target);
      }
    })();
  </script>
